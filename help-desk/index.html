<!--
  Why this waits instead of redirecting instantly (added 2026-09-04).

  This page is the click target for every email link to the free Skool room, so it is the only
  place a REAL human click can be counted. School mail scanners (Mimecast, Proofpoint, Defender
  Safe Links) fetch every URL in an email before delivery, which inflated Kit's click numbers to
  roughly 3 clicks per "clicker" across every send: exactly the number of links in the email.
  Scanners do not execute JavaScript, so a JS-gated beacon counts people and not machines.

  Previously this page redirected with meta refresh at 0s AND an immediate location.replace, and
  carried no beacon at all. Cloudflare Web Analytics therefore had zero data for it, which read
  as "the page is not indexed" when in fact nothing had ever been instrumented.

  1200ms gives the deferred beacon time to send. Do not reduce it without checking that
  Cloudflare still records the pageview.
-->
<script>
  setTimeout(function () {
    window.location.replace("https://www.skool.com/gcse-igcse-physics-help-desk-4125");
  }, 1200);
</script>
